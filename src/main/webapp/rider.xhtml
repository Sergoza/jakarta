<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Наездники</title>
</h:head>
<h:body>
    <h2>Управление наездниками</h2>

    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="ФИО:" />
            <h:inputText value="#{riderView.rider.fio}" required="true"/>

            <h:outputLabel value="Опыт (лет):" />
            <h:inputText value="#{riderView.rider.experience}" required="true"/>

            <h:outputLabel value="Телефон:" />
            <h:inputText value="#{riderView.rider.phoneNumber}" required="true"/>
        </h:panelGrid>
        <br/>
        <h:commandButton value="Сохранить" action="#{riderView.save}" />
    </h:form>

    <br/>

    <h:dataTable value="#{riderView.riders}" var="r" border="1">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{r.id}
        </h:column>
        <h:column>
            <f:facet name="header">ФИО</f:facet>
            #{r.fio}
        </h:column>
        <h:column>
            <f:facet name="header">Опыт</f:facet>
            #{r.experience}
        </h:column>
        <h:column>
            <f:facet name="header">Телефон</f:facet>
            #{r.phoneNumber}
        </h:column>
        <h:column>
            <f:facet name="header">Действия</f:facet>
            <h:form>
                <h:commandButton value="Ред." action="#{riderView.edit(r)}" />
                <h:commandButton value="Удалить" action="#{riderView.delete(r.id)}" />
            </h:form>
        </h:column>
    </h:dataTable>

    <br/>
    <h:link value="На главную" outcome="index" />
</h:body>
</html>
