<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Лошади</title>
</h:head>
<h:body>
    <h2>Управление лошадьми</h2>

    <h:form>
        <!-- Форма добавления/редактирования -->
        <h:panelGrid columns="2">
            <h:outputLabel value="Кличка:" />
            <h:inputText value="#{horseView.horse.name}" required="true"/>

            <h:outputLabel value="Порода:" />
            <h:inputText value="#{horseView.horse.breed}" required="true"/>

            <h:outputLabel value="Возраст:" />
            <h:inputText value="#{horseView.horse.age}" required="true"/>

            <h:outputLabel value="Вес:" />
            <h:inputText value="#{horseView.horse.weight}" required="true"/>
        </h:panelGrid>
        <br/>
        <h:commandButton value="Сохранить" action="#{horseView.save}" />
    </h:form>

    <br/>

    <!-- Таблица со списком лошадей -->
    <h:dataTable value="#{horseView.horses}" var="h" border="1">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{h.id}
        </h:column>
        <h:column>
            <f:facet name="header">Кличка</f:facet>
            #{h.name}
        </h:column>
        <h:column>
            <f:facet name="header">Порода</f:facet>
            #{h.breed}
        </h:column>
        <h:column>
            <f:facet name="header">Возраст</f:facet>
            #{h.age}
        </h:column>
        <h:column>
            <f:facet name="header">Вес</f:facet>
            #{h.weight}
        </h:column>
        <h:column>
            <f:facet name="header">Действия</f:facet>
            <h:form>
                <h:commandButton value="Ред." action="#{horseView.edit(h)}" />
                <h:commandButton value="Удалить" action="#{horseView.delete(h.id)}" />
            </h:form>
        </h:column>
    </h:dataTable>

    <br/>
    <h:link value="На главную" outcome="index" />
</h:body>
</html>
